base: baseline.yaml
experiment: hw2
output_dir: results/hw2
# Five folds estimate the primary endpoint. The two additional initializations
# measure fold-0 seed sensitivity and are never counted as independent folds.
runs:
  - {fold: 0, seed: 42}
  - {fold: 1, seed: 42}
  - {fold: 2, seed: 42}
  - {fold: 3, seed: 42}
  - {fold: 4, seed: 42}
  - {fold: 0, seed: 43}
  - {fold: 0, seed: 44}
hw2:
  stages: [layer3, layer4]
  ridge: 1.0
  alpha: 1.0
  prior_strength: 1.0
  checkpoint_dir: checkpoints/b2_resnet18
  archive_dir: results/b2_resnet18
