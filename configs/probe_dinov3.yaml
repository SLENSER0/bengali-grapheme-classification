# B3: frozen DINOv3 ViT-S/16 (LVD-1689M self-supervised) + linear heads on concat(CLS, mean patch).
base: common.yaml
experiment: b3_dinov3_vits16_probe
output_dir: results/b3_dinov3_vits16_probe
encoder:
  encoder: dinov3
  model_name: vit_small_patch16_dinov3.lvd1689m
  input_size: 224
  invert: true            # dark ink on light background, like documents in pretraining data
  batch_size: 256
probe:
  epochs: 30
  batch_size: 4096
  lr: 3.0e-3
  weight_decay: 1.0e-4
  dropout: 0.0
