[project]
name = "bengali-grapheme-rnd"
version = "0.1.0"
description = "Bengali.AI Handwritten Grapheme Classification: problem statement, baselines and leak-free evaluation protocol (RnD ML course, HW1)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "pyyaml>=6",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "opencv-python-headless>=4.10",
    "torch>=2.5",
    "timm>=1.0.20",
    "open_clip_torch>=3.2",
    "kaggle>=1.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bengali"]

[tool.pytest.ini_options]
testpaths = ["tests"]
