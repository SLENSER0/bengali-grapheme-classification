data:
  processed_dir: data/processed
  img_size: 128
  folds_file: splits/folds.csv
  subset: null
device: auto
folds:
- 0
- 1
- 2
- 3
- 4
seeds:
- 42
eval:
  batch_size: 1024
experiment: hw2_freq
output_dir: results/hw2/controls/freq
model:
  backbone: resnet18.tv_in1k
  pretrained: true
  dropout: 0.0
train:
  epochs: 6
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  warmup_frac: 0.1
  min_last_batch: 128
  loss_weights:
  - 1.0
  - 1.0
  - 1.0
  amp: none
  log_val_every_epoch: true
save_checkpoint: true
runs:
- fold: 0
  seed: 42
- fold: 1
  seed: 42
- fold: 2
  seed: 42
- fold: 3
  seed: 42
- fold: 4
  seed: 42
- fold: 0
  seed: 43
- fold: 0
  seed: 44
hw2:
  stages:
  - layer3
  - layer4
  ridge: 1.0
  alpha: 1.0
  prior_strength: 1.0
  checkpoint_dir: checkpoints/b2_resnet18
  archive_dir: results/b2_resnet18
run:
  fold: 4
  seed: 42
